<!DOCTYPE html><html data-theme="vscode-dark" lang="en"><head><meta charset="UTF-8"><meta content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover" name="viewport"><meta content="FretPath — Guitar practice toolkit" name="description"><meta content="#1e1e1e" name="theme-color"><meta content="yes" name="apple-mobile-web-app-capable"><meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"><link href="manifest.json" rel="manifest"><link href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>" rel="icon" type="image/svg+xml"><title>FretPath</title><style>body{margin:0;background:#1e1e1e}.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-primary,#1e1e1e);z-index:9999;transition:opacity .4s ease,visibility .4s ease}.splash.fade-out{opacity:0;visibility:hidden}.splash__logo{font-size:4rem;margin-bottom:.5rem;animation:splash-pulse 1.5s ease-in-out infinite}.splash__title{font-size:2rem;font-weight:700;color:var(--text-bright,#fff)}.splash__subtitle{font-size:.9rem;color:var(--text-secondary,#9d9d9d);margin-top:.25rem}.splash__loader{margin-top:2rem;width:40px;height:4px;background:var(--bg-tertiary,#2d2d2d);border-radius:2px;overflow:hidden}.splash__loader span{display:block;width:50%;height:100%;background:var(--accent-primary,#007acc);border-radius:2px;animation:splash-load 1s ease-in-out infinite}@keyframes splash-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes splash-load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}</style><link href="css/style.bundle.css" rel="stylesheet"><script src="lib/webaudiofont/WebAudioFontPlayer.js" defer="defer"></script><script src="lib/webaudiofont/0250_FluidR3_GM_sf2_file.js" defer="defer"></script><script src="js/app.bundle.js" type="module"></script></head><body><a class="skip-link" data-i18n="nav.skip iew-toolkit" role="tabpanel"><div class="view__header"><h2 class="view__title" data-i18n="nav.view.toolkit">Toolkit</h2><p class="view__subtitle" data-i18n="nav.view_subtitle.toolkit">Pick any tool and start practicing</p></div><div class="toolkit" id="toolkit-container"></div></section><section class="hidden view" data-view="ear" id="view-ear" role="tabpanel"><div id="ear-training-container"></div></section><section class="hidden view" data-view="exercise" id="view-exercise"><div class="exercise-container" id="exercise-container" aria-live="polite"></div></section></main></div><div class="hidden settings-modal" id="settings-modal" aria-label="Settings" data-i18n-aria="nav.aria.settings" role="dialog" aria-modal="true"><div class="settings-modal__overlay" id="settings-modal-overlay"></div><div class="settings-modal__panel"><div class="settings-modal__header"><h2 class="settings-modal__title" data-i18n="settings.title">⚙️ Settings</h2><button class="settings-modal__close" aria-label="Close settings" data-i18n-aria="nav.aria.close_settings" id="settings-modal-close">✕</button></div><div class="settings-modal__body" id="settings-form"></div></div></div><input class="hidden" id="import-file" type="file" accept=".json"></body></html>
